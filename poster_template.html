<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noodle Box — Your 2-Minute Break, Sorted</title>
  <style>
    @page { size: A5; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000000; color: #FFFFFF; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .poster { width: 148mm; height: 210mm; max-width: 100%; margin: 0 auto; padding: 10mm 11mm 8mm; overflow: hidden; background: #000000; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand { color: #FF6B00; display: flex; align-items: center; gap: 3mm; font-weight: 900; font-size: 16pt; letter-spacing: -.04em; }
    .brand svg { width: 16mm; height: 18mm; }
    h1 { color: #FF6B00; font-size: 31pt; line-height: .98; letter-spacing: -.055em; margin: 8mm 0 3mm; max-width: 120mm; }
    .offer { margin: 0; color: #FFFFFF; font-size: 18pt; font-weight: 800; line-height: 1.15; }
    .offer strong { color: #FF6B00; }
    .cup { color: #FF6B00; width: 43mm; height: 47mm; margin: 3mm auto 1mm; }
    .cta { max-width: 115mm; margin: 0 0 5mm; font-size: 11.5pt; line-height: 1.25; font-weight: 700; }
    .qr-wrap { background: #FFFFFF; border: 2mm solid #FFFFFF; width: 40mm; height: 40mm; padding: 1mm; display: grid; place-items: center; }
    .qr-wrap svg { display: block; width: 100%; height: 100%; }
    .scan { margin: 2mm 0 0; color: #FF6B00; font-size: 9pt; font-weight: 800; letter-spacing: .08em; }
    .small { margin-top: auto; padding-top: 5mm; font-size: 7.5pt; line-height: 1.2; color: #FFFFFF; }
    @media screen { body { padding: 12px 0; } .poster { box-shadow: 0 0 0 1px #FF6B00; } }
    @media print { .poster { width: 148mm; height: 210mm; } }
  </style>
</head>
<body>
<main class="poster">
  <div class="brand">
    <svg viewBox="0 0 64 72" role="img" aria-label="Outlined Noodle Box cup" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 25h32l-4 39H20l-4-39Z"/><path d="M12 22c0-4 40-4 40 0s-40 4-40 0Z"/>
      <path d="M22 11c-5-5 5-6 0-11M32 13c-5-5 5-6 0-11M42 11c-5-5 5-6 0-11"/>
      <path d="M24 36c3 4 5-4 8 0s5-4 8 0M25 46c3 4 5-4 8 0s5-4 8 0"/>
    </svg>
    <span>NOODLE BOX</span>
  </div>
  <h1>Your 2-Minute Break, Sorted.</h1>
  <p class="offer"><strong>50% OFF</strong> your first Noodle Cup.</p>
  <svg class="cup" viewBox="0 0 120 132" role="img" aria-label="Outlined cup of noodles" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 44h58l-7 76H38l-7-76Z"/><path d="M23 39c0-7 74-7 74 0s-74 7-74 0Z"/>
    <path d="M47 22c-10-10 10-12 0-22M61 25c-10-10 10-12 0-22M75 22c-10-10 10-12 0-22"/>
    <path d="M45 66c5 7 9-7 14 0s9-7 14 0M47 86c5 7 9-7 14 0s9-7 14 0"/>
  </svg>
  <p class="cta">Scan to tell us what you want<br>(and claim your discount).</p>
  <div class="qr-wrap">{{ QR_SVG }}</div>
  <p class="scan">SCAN HERE</p>
  <p class="small">University Beta Test • Noodle Box NZ • Limited Time</p>
</main>
</body>
</html>
